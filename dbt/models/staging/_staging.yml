version: 2
models:
  - name: stg_meters
    columns:
      - name: meter_id
        data_tests: [unique, not_null]
      - name: feeder_id
        data_tests: [not_null]
  - name: stg_vends
    columns:
      - name: vend_id
        data_tests: [unique, not_null]
      - name: meter_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_meters')
                field: meter_id
  - name: stg_feeder_supply
    data_tests:
      - unique_combination:
          arguments:
            columns: [feeder_id, supply_date]
