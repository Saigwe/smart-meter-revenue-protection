# Synthetic fixture for CI. Same table and column names as the real-data load.
# pk / fk / cast describe the tables for staging and tests; the generator ignores them.
seed: 1717
tables:
  - name: feeders
    rows: 10
    pk: feeder_id
    columns:
      feeder_id: {type: id, prefix: F, width: 3}
      substation: {type: choice, values: [Alausa, Ikorodu, Oshodi, Agege]}
  - name: meters
    rows: 300
    pk: meter_id
    fk: {feeder_id: feeders.feeder_id}
    columns:
      meter_id: {type: id, prefix: MTR}
      feeder_id: {type: fk, table: feeders, column: feeder_id}
      tariff_band: {type: choice, values: [A, B, C, D], p: [0.2, 0.3, 0.3, 0.2]}
  - name: readings
    grid: {parent: meters.meter_id, start: "2025-01-06 00:00:00", end: "2025-01-19 23:30:00", freq: 30min, column: reading_ts}
    pk: [meter_id, reading_ts]
    fk: {meter_id: meters.meter_id}
    columns:
      kwh: {type: float, dist: lognormal, mean: -1.2, sigma: 0.6, decimals: 3}
  - name: vends
    rows: 2500
    pk: vend_id
    fk: {meter_id: meters.meter_id}
    columns:
      vend_id: {type: id, prefix: V}
      meter_id: {type: fk, table: meters, column: meter_id}
      vend_ts: {type: timestamp, start: "2025-01-06 00:00:00", end: "2025-01-19 23:59:59"}
      kwh_purchased: {type: float, low: 5, high: 40}
